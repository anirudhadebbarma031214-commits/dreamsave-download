<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamSave</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #05070d;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 25px;
        }

        .logo {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            color: #aab4c3;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .download {
            display: inline-block;
            padding: 16px 32px;
            background: #00e5ff;
            color: #001015;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 18px;
        }

        .download:hover {
            transform: scale(1.05);
        }

        .features {
            margin-top: 40px;
            text-align: left;
        }

        .feature {
            background: #0c111c;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }

        .footer {
            margin-top: 35px;
            color: #667080;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">💰</div>

    <h1>DreamSave</h1>

    <p>
        Save money every day.<br>
        Track your progress. Reach your dream.
    </p>

    <a class="download" href="Dreamsave.apk" download>
        ⬇️ Download DreamSave
    </a>

    <div class="features">
        <div class="feature">🎯 Create savings goals</div>
        <div class="feature">💵 Add daily savings</div>
        <div class="feature">📈 Track your progress</div>
        <div class="feature">🔥 Build saving streaks</div>
        <div class="feature">📜 View savings history</div>
    </div>

    <div class="footer">
        DreamSave • Made with ❤️
    </div>

</div>

</body>
</html>
